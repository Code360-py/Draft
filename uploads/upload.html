<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HF Cloud Photo Vault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .preview-box {
      max-height: 240px;
      object-fit: contain;
      border-radius: 8px;
      border: 1px dashed #ced4da;
      background-color: #ffffff;
      padding: 6px;
    }
    .gallery-img {
      height: 180px;
      object-fit: cover;
      border-top-left-radius: 6px;
      border-top-right-radius: 6px;
      background: #f1f1f1;
    }
  </style>
</head>
<body class="py-4">
  <div class="container" style="max-width: 820px;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between pb-3 mb-4 border-bottom">
      <div class="d-flex align-items-center gap-2">
        <i class="bi bi-images fs-3 text-primary"></i>
        <h4 class="mb-0 fw-bold">HF Photo Cloud Vault</h4>
      </div>
      <span id="syncBadge" class="badge bg-secondary">Disconnected</span>
    </div>

    <!-- Repository Settings Form -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body">
        <h6 class="card-title text-muted text-uppercase fw-bold fs-7 mb-2">Hugging Face Setup</h6>
        <div class="row g-2 mb-2">
          <div class="col-md-6">
            <input type="password" id="hfToken" class="form-control form-control-sm mono" placeholder="HF Write Token (hf_...)">
          </div>
          <div class="col-md-6">
            <input type="text" id="repoId" class="form-control form-control-sm mono" placeholder="Repo ID (e.g. XenonStudio/Property)">
          </div>
        </div>
        <button class="btn btn-dark btn-sm w-100" id="btnConnect" onclick="connectAndLoad()">
          <i class="bi bi-cloud-arrow-down me-1"></i> Connect & Sync Vault
        </button>
      </div>
    </div>

    <!-- Upload Card -->
    <div class="card shadow-sm border-0 mb-4">
      <div class="card-body p-4">
        <h6 class="card-title text-muted text-uppercase fw-bold fs-7 mb-3">Upload New Photo</h6>
        
        <div class="mb-3">
          <input type="file" id="imageInput" class="form-control form-control-sm" accept="image/*" onchange="previewSelected()" disabled>
        </div>

        <div id="previewContainer" class="text-center my-3 d-none">
          <img id="imagePreview" class="preview-box w-100 mb-2" alt="Selected preview">
          <div class="small text-muted mono" id="fileMeta"></div>
        </div>

        <button class="btn btn-primary w-100 fw-bold" id="btnUpload" onclick="savePhotoToVault()" disabled>
          <i class="bi bi-cloud-arrow-up-fill me-1"></i> Save Photo to HF Vault
        </button>
        <div id="statusMessage" class="form-text text-center mt-2 small fw-semibold"></div>
      </div>
    </div>

    <!-- Photo Gallery Grid -->
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
        <span class="fw-bold">Vault Photos (<span id="photoCount">0</span>)</span>
        <button class="btn btn-outline-secondary btn-sm" onclick="fetchVault()" id="btnRefresh" disabled>
          <i class="bi bi-arrow-clockwise"></i> Refresh
        </button>
      </div>
      <div class="card-body">
        <div class="row g-3" id="galleryGrid">
          <div class="col-12 text-center py-4 text-muted small">Connect repository to view saved photos</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const CONFIG_KEY = 'hf_photo_vault_config';
    const FILE_NAME = 'photos.json';

    let repoBranch = 'main';
    let photoVault = [];
    let currentBase64 = null;
    let currentFileName = '';

    window.addEventListener('DOMContentLoaded', () => {
      const saved = JSON.parse(localStorage.getItem(CONFIG_KEY) || '{}');
      if (saved.token) document.getElementById('hfToken').value = saved.token;
      if (saved.repo) document.getElementById('repoId').value = saved.repo;
      if (saved.token && saved.repo) connectAndLoad();
    });

    function getCredentials() {
      return {
        token: document.getElementById('hfToken').value.trim(),
        repo: document.getElementById('repoId').value.trim()
      };
    }

    function setBadge(state, text) {
      const badge = document.getElementById('syncBadge');
      const colors = {
        connected: 'bg-success',
        syncing: 'bg-warning text-dark',
        error: 'bg-danger',
        disconnected: 'bg-secondary'
      };
      badge.className = `badge ${colors[state] || 'bg-secondary'}`;
      badge.textContent = text;
    }

    async function connectAndLoad() {
      const { token, repo } = getCredentials();
      if (!token || !repo) {
        alert('Please fill in both your HF Token and Dataset Repo ID.');
        return;
      }

      setBadge('syncing', 'Connecting...');

      try {
        const verifyRes = await fetch(`https://huggingface.co/api/datasets/${repo}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!verifyRes.ok) throw new Error(`Repo not found or access denied (${verifyRes.status})`);
        
        const repoData = await verifyRes.json();
        if (repoData.defaultBranch) {
          repoBranch = repoData.defaultBranch;
        }

        localStorage.setItem(CONFIG_KEY, JSON.stringify({ token, repo }));

        document.getElementById('imageInput').disabled = false;
        document.getElementById('btnRefresh').disabled = false;

        await fetchVault();
        setBadge('connected', 'Ready');
      } catch (err) {
        setBadge('error', 'Auth Failed');
        alert('Connection error: ' + err.message);
      }
    }

    async function fetchVault() {
      const { token, repo } = getCredentials();
      try {
        const rawUrl = `https://huggingface.co/datasets/${repo}/raw/${repoBranch}/${FILE_NAME}?t=${Date.now()}`;
        const fileRes = await fetch(rawUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (fileRes.ok) {
          photoVault = await fileRes.json();
        } else if (fileRes.status === 404) {
          photoVault = [];
        }

        renderGallery();
      } catch (err) {
        console.error('Fetch vault error:', err);
      }
    }

    function previewSelected() {
      const input = document.getElementById('imageInput');
      const preview = document.getElementById('imagePreview');
      const container = document.getElementById('previewContainer');
      const meta = document.getElementById('fileMeta');
      const uploadBtn = document.getElementById('btnUpload');

      if (!input.files.length) {
        container.classList.add('d-none');
        uploadBtn.disabled = true;
        currentBase64 = null;
        return;
      }

      const file = input.files[0];
      currentFileName = file.name;

      const reader = new FileReader();
      reader.onload = function(e) {
        currentBase64 = e.target.result; // full data URL (e.g. data:image/png;base64,...)
        preview.src = currentBase64;
        meta.textContent = `${file.name} | ${(file.size / 1024).toFixed(1)} KB`;
        container.classList.remove('d-none');
        uploadBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const count = document.getElementById('photoCount');
      count.textContent = photoVault.length;
      grid.innerHTML = '';

      if (photoVault.length === 0) {
        grid.innerHTML = '<div class="col-12 text-center py-4 text-muted small">No photos in vault yet</div>';
        return;
      }

      photoVault.forEach((photo, idx) => {
        const col = document.createElement('div');
        col.className = 'col-sm-6 col-md-4';
        col.innerHTML = `
          <div class="card h-100 shadow-sm border-0">
            <img src="${photo.dataUrl}" class="gallery-img w-100" alt="${escapeHtml(photo.name)}">
            <div class="card-body p-2 d-flex flex-column justify-content-between">
              <div>
                <div class="fw-semibold text-truncate small mb-1" title="${escapeHtml(photo.name)}">${escapeHtml(photo.name)}</div>
                <div class="text-muted" style="font-size: 11px;">${photo.uploadedAt || ''}</div>
              </div>
              <div class="d-flex justify-content-between mt-2 pt-1 border-top">
                <a href="${photo.dataUrl}" download="${photo.name}" class="btn btn-sm btn-outline-primary py-0 px-2">
                  <i class="bi bi-download"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="deletePhoto(${idx})">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(col);
      });
    }

    // Save updated photo vault JSON using our proven NDJSON commit flow
    async function savePhotoToVault() {
      const { token, repo } = getCredentials();
      const status = document.getElementById('statusMessage');
      const btnUpload = document.getElementById('btnUpload');

      if (!currentBase64) return;

      setBadge('syncing', 'Saving...');
      btnUpload.disabled = true;
      status.className = 'form-text text-center mt-2 small text-primary fw-semibold';
      status.textContent = 'Syncing photo to Hugging Face...';

      // Append new photo object
      photoVault.unshift({
        id: Date.now().toString(),
        name: currentFileName,
        uploadedAt: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString(),
        dataUrl: currentBase64
      });

      try {
        const jsonContent = JSON.stringify(photoVault, null, 2);

        // UTF-8 to Base64 encoder
        const utf8Bytes = new TextEncoder().encode(jsonContent);
        let binaryStr = '';
        utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
        const base64Data = btoa(binaryStr);

        const headerLine = JSON.stringify({
          key: "header",
          value: { summary: `Add photo ${currentFileName} to vault` }
        });

        const opLine = JSON.stringify({
          key: "file",
          value: {
            path: FILE_NAME,
            operation: "addOrUpdate",
            content: base64Data,
            encoding: "base64"
          }
        });

        const ndjsonPayload = `${headerLine}\n${opLine}\n`;

        const res = await fetch(`https://huggingface.co/api/datasets/${repo}/commit/${repoBranch}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/x-ndjson'
          },
          body: ndjsonPayload
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || errData.message || `Status ${res.status}`);
        }

        setBadge('connected', 'Saved');
        status.className = 'form-text text-center mt-2 small text-success fw-semibold';
        status.textContent = 'Photo saved successfully!';

        // Reset upload preview
        document.getElementById('imageInput').value = '';
        document.getElementById('previewContainer').classList.add('d-none');
        currentBase64 = null;

        renderGallery();
      } catch (err) {
        setBadge('error', 'Save Failed');
        status.className = 'form-text text-center mt-2 small text-danger fw-semibold';
        status.textContent = 'Save failed: ' + err.message;
        console.error('Save photo error:', err);
      } finally {
        btnUpload.disabled = false;
      }
    }

    async function deletePhoto(idx) {
      if (!confirm('Are you sure you want to delete this photo?')) return;
      photoVault.splice(idx, 1);
      renderGallery();

      const { token, repo } = getCredentials();
      setBadge('syncing', 'Updating...');

      try {
        const jsonContent = JSON.stringify(photoVault, null, 2);
        const utf8Bytes = new TextEncoder().encode(jsonContent);
        let binaryStr = '';
        utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
        const base64Data = btoa(binaryStr);

        const headerLine = JSON.stringify({
          key: "header",
          value: { summary: `Delete photo from vault` }
        });

        const opLine = JSON.stringify({
          key: "file",
          value: {
            path: FILE_NAME,
            operation: "addOrUpdate",
            content: base64Data,
            encoding: "base64"
          }
        });

        const res = await fetch(`https://huggingface.co/api/datasets/${repo}/commit/${repoBranch}`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/x-ndjson'
          },
          body: `${headerLine}\n${opLine}\n`
        });

        if (!res.ok) throw new Error(`Commit failed: ${res.status}`);
        setBadge('connected', 'Synced');
      } catch (err) {
        setBadge('error', 'Error');
        alert('Failed to delete photo: ' + err.message);
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
