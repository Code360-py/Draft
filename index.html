<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultimate Clock</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body { background:#000; color:#fff; font-family:'Roboto',sans-serif; overflow:hidden; }

.app {
  max-width:420px;
  margin:auto;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header { text-align:center; padding:15px; font-size:18px; opacity:.8; }

/* PAGE */
.page { display:none; padding:20px; height:100%; animation:fade .3s; }
.page.active { display:block; }

@keyframes fade { from{opacity:0; transform:translateY(10px);} }

/* TEXT */
.big { font-size:60px; text-align:center; font-weight:300; }

/* CENTER */
.center {
  height:55vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* CONTROLS */
.controls {
  position:fixed;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
}

.circle-btn {
  width:70px;height:70px;border-radius:50%;
  transition:.2s;
}
.circle-btn:active { transform:scale(.9); }

/* CARD */
.card-dark {
  background:#1c1c1c;
  border-radius:18px;
  padding:15px;
  margin-top:10px;
}

/* SWITCH */
.switch { width:46px;height:26px;position:relative; }
.switch input { display:none; }
.slider {
  position:absolute;width:100%;height:100%;
  background:#555;border-radius:30px;
}
.slider::before {
  content:"";width:20px;height:20px;
  background:#fff;border-radius:50%;
  position:absolute;top:3px;left:3px;
  transition:.3s;
}
input:checked + .slider { background:#8ab4f8; }
input:checked + .slider::before { transform:translateX(20px); }

.delete-btn { color:#ff4d4d; cursor:pointer; }

/* WHEEL */
.wheel {
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:15px;
}
.wheel select {
  background:#111;
  color:#fff;
  border:none;
  font-size:22px;
  padding:10px;
  border-radius:10px;
}

/* TIMER RING */
.ring {
  position:relative;
  width:220px;
  height:220px;
}
.ring svg { transform:rotate(-90deg); }
.ring circle { fill:none; stroke-width:10; }
.bg { stroke:#333; }
.progress {
  stroke:#8ab4f8;
  stroke-linecap:round;
  transition:stroke-dashoffset 1s linear;
}
.ring-text {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

/* NAV */
.navbar-custom { background:#111; }
.nav-item { text-align:center;font-size:12px;color:#aaa; }
.nav-item.active { color:#8ab4f8; }
</style>
</head>

<body>

<div class="app">

<div class="header" id="title">Alarm</div>

<div class="flex-grow-1">

<!-- CLOCK + WORLD -->
<div id="clockPage" class="page active">

  <div class="big" id="clockTime"></div>
  <div class="text-center text-secondary mb-3" id="clockDate"></div>

  <div class="input-group mb-3">
    <select id="citySelect" class="form-control bg-dark text-white border-0"></select>
    <button class="btn btn-primary" onclick="addCity()">
      <i class="fa fa-plus"></i>
    </button>
  </div>

  <div id="worldClocks"></div>

</div>

<!-- ALARM -->
<div id="alarmPage" class="page">
  <div class="wheel">
    <select id="hour"></select>
    <select id="minute"></select>
  </div>

  <button class="btn btn-primary w-100 mb-2" onclick="addAlarm()">
    <i class="fa fa-plus"></i> Add Alarm
  </button>

  <div id="alarmList"></div>
</div>

<!-- TIMER -->
<div id="timerPage" class="page">

  <div class="wheel">
    <select id="tHour"></select>
    <select id="tMin"></select>
    <select id="tSec"></select>
  </div>

  <div class="center">
    <div class="ring">
      <svg width="220" height="220">
        <circle cx="110" cy="110" r="100" class="bg"/>
        <circle cx="110" cy="110" r="100" class="progress" id="progressCircle"/>
      </svg>
      <div class="ring-text">
        <div class="big" id="timerDisplay">00:00</div>
      </div>
    </div>
  </div>

  <div class="controls d-flex gap-3">
    <button class="btn btn-success circle-btn" onclick="startTimer()"><i class="fa fa-play"></i></button>
    <button class="btn btn-warning circle-btn" onclick="pauseTimer()"><i class="fa fa-pause"></i></button>
    <button class="btn btn-danger circle-btn" onclick="resetTimer()"><i class="fa fa-rotate-left"></i></button>
  </div>

</div>

<!-- STOPWATCH -->
<div id="stopwatchPage" class="page">
  <div class="center">
    <div class="big" id="stopwatchDisplay">00:00:00</div>
  </div>

  <div class="controls d-flex gap-3">
    <button class="btn btn-success circle-btn" onclick="startStopwatch()"><i class="fa fa-play"></i></button>
    <button class="btn btn-warning circle-btn" onclick="stopStopwatch()"><i class="fa fa-pause"></i></button>
    <button class="btn btn-danger circle-btn" onclick="resetStopwatch()"><i class="fa fa-rotate-left"></i></button>
  </div>
</div>

</div>

<!-- NAV -->
<nav class="navbar navbar-dark navbar-custom">
<div class="container-fluid d-flex justify-content-around">

<div class="nav-item active" onclick="showPage('alarmPage', this, 'Alarm')">
<i class="fa fa-bell d-block"></i>Alarm</div>

<div class="nav-item" onclick="showPage('clockPage', this, 'Clock')">
<i class="fa fa-clock d-block"></i>Clock</div>

<div class="nav-item" onclick="showPage('timerPage', this, 'Timer')">
<i class="fa fa-hourglass-half d-block"></i>Timer</div>

<div class="nav-item" onclick="showPage('stopwatchPage', this, 'Stopwatch')">
<i class="fa fa-stopwatch d-block"></i>Stopwatch</div>

</div>
</nav>

</div>

<audio id="sound" loop>
<source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3">
</audio>

<script>

/* PAGE */
function showPage(id, el, titleText){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  title.textContent=titleText;
}

/* CLOCK + WORLD */
const cities=[
{name:"New York",tz:"America/New_York"},
{name:"London",tz:"Europe/London"},
{name:"Dubai",tz:"Asia/Dubai"},
{name:"Tokyo",tz:"Asia/Tokyo"},
{name:"Sydney",tz:"Australia/Sydney"},
{name:"Chennai",tz:"Asia/Kolkata"}
];

cities.forEach(c=>{
  citySelect.innerHTML+=`<option value="${c.tz}">${c.name}</option>`;
});

let world=JSON.parse(localStorage.getItem("worldClocks"))||[];

function saveWorld(){ localStorage.setItem("worldClocks",JSON.stringify(world)); }

function addCity(){
  const tz=citySelect.value;
  if(world.some(c=>c.tz===tz)) return;
  world.push(cities.find(c=>c.tz===tz));
  saveWorld(); renderWorld();
}

function deleteCity(i){
  world.splice(i,1);
  saveWorld(); renderWorld();
}

function renderWorld(){
  worldClocks.innerHTML="";
  if(!world.length){
    worldClocks.innerHTML=`<div class="text-center text-secondary mt-3">No world clocks</div>`;
    return;
  }
  world.forEach((c,i)=>{
    worldClocks.innerHTML+=`
    <div class="card-dark d-flex justify-content-between align-items-center">
      <div>
        <div>${c.name}</div>
        <small id="tz-${i}"></small>
      </div>
      <i class="fa fa-trash delete-btn" onclick="deleteCity(${i})"></i>
    </div>`;
  });
}

/* CLOCK UPDATE */
setInterval(()=>{
  const n=new Date();
  clockTime.textContent=n.toLocaleTimeString();
  clockDate.textContent=n.toDateString();

  world.forEach((c,i)=>{
    const t=new Date().toLocaleTimeString("en-US",{timeZone:c.tz});
    const el=document.getElementById(`tz-${i}`);
    if(el) el.textContent=t;
  });

},1000);

/* INIT WHEELS */
for(let i=0;i<24;i++){
  hour.innerHTML+=`<option>${pad(i)}</option>`;
  tHour.innerHTML+=`<option>${pad(i)}</option>`;
}
for(let i=0;i<60;i++){
  minute.innerHTML+=`<option>${pad(i)}</option>`;
  tMin.innerHTML+=`<option>${pad(i)}</option>`;
  tSec.innerHTML+=`<option>${pad(i)}</option>`;
}

/* ALARM */
let alarms=JSON.parse(localStorage.getItem("alarms"))||[];
function saveAlarms(){localStorage.setItem("alarms",JSON.stringify(alarms));}

function addAlarm(){
  const time=`${hour.value}:${minute.value}`;
  if(alarms.some(a=>a.time===time)) return;
  alarms.push({time,active:true});
  saveAlarms(); renderAlarms();
}

function renderAlarms(){
  alarmList.innerHTML="";
  if(!alarms.length){
    alarmList.innerHTML=`<div class="text-center text-secondary mt-4">No alarms</div>`;
    return;
  }
  alarms.forEach((a,i)=>{
    alarmList.innerHTML+=`
    <div class="card-dark d-flex justify-content-between align-items-center">
      <div>${a.time}</div>
      <div class="d-flex gap-3">
        <label class="switch">
          <input type="checkbox" ${a.active?"checked":""} onchange="toggleAlarm(${i})">
          <span class="slider"></span>
        </label>
        <i class="fa fa-trash delete-btn" onclick="deleteAlarm(${i})"></i>
      </div>
    </div>`;
  });
}

function toggleAlarm(i){ alarms[i].active=!alarms[i].active; saveAlarms(); }
function deleteAlarm(i){ alarms.splice(i,1); saveAlarms(); renderAlarms(); }

setInterval(()=>{
  const now=new Date().toTimeString().slice(0,5);
  alarms.forEach(a=>{
    if(a.time===now && a.active) sound.play();
  });
},1000);

/* TIMER */
let timer=0,total=0,ti=null;
const radius=100;
const circumference=2*Math.PI*radius;

progressCircle.style.strokeDasharray=circumference;
progressCircle.style.strokeDashoffset=circumference;

function getTimer(){ return tHour.value*3600+tMin.value*60+parseInt(tSec.value); }

function updateRing(){
  if(total===0) return;
  let offset=circumference*(1-(timer/total));
  progressCircle.style.strokeDashoffset=offset;
}

function startTimer(){
  if(ti) return;
  if(timer===0){ timer=getTimer(); total=timer; }
  if(timer<=0) return;

  ti=setInterval(()=>{
    if(timer<=0){
      clearInterval(ti);
      ti=null;
      sound.play();
      return;
    }
    timer--;
    timerDisplay.textContent=format(timer);
    updateRing();
  },1000);
}

function pauseTimer(){ clearInterval(ti); ti=null; }

function resetTimer(){
  clearInterval(ti); ti=null;
  timer=0; total=0;
  timerDisplay.textContent="00:00";
  progressCircle.style.strokeDashoffset=circumference;
}

function format(s){
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  let sec=s%60;
  return h>0?`${pad(h)}:${pad(m)}:${pad(sec)}`:`${pad(m)}:${pad(sec)}`;
}

/* STOPWATCH */
let sw=0,si=null;
function startStopwatch(){ if(si) return; si=setInterval(()=>{sw++;updateSW();},1000); }
function stopStopwatch(){clearInterval(si);si=null;}
function resetStopwatch(){sw=0;updateSW();}
function updateSW(){
  stopwatchDisplay.textContent=
  `${pad(Math.floor(sw/3600))}:${pad(Math.floor(sw%3600)/60)}:${pad(sw%60)}`;
}

function pad(n){return n<10?"0"+n:n;}

renderWorld();
renderAlarms();

</script>

</body>
</html>
